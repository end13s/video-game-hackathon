<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0b1530">
  <title>Press Conference</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/phone.css">
</head>
<body data-screen="join">
  <header>
    <span id="me-tag"></span>
    <span id="timer" class="hidden"></span>
    <span id="conn" class="off">●</span>
  </header>

  <main>
    <section data-screen="join">
      <h1 class="title">Press<br>Conference</h1>
      <form id="join-form">
        <input id="name" maxlength="16" placeholder="Your name" autocomplete="off" autocapitalize="words" enterkeyhint="go">
        <button class="big" type="submit">Join</button>
      </form>
      <p id="join-error" class="error"></p>
    </section>

    <section data-screen="lobby">
      <p class="kicker">You are</p>
      <div class="char-card">
        <div class="avatar"></div>
        <h2 class="char-name"></h2>
        <p class="char-title"></p>
      </div>
      <p class="muted">Waiting for the host to start…</p>
    </section>

    <section data-screen="look">
      <p class="kicker" id="look-kicker"></p>
      <p class="look-text" id="look-text"></p>
      <p class="muted" id="look-sub"></p>
    </section>

    <section data-screen="answer">
      <p class="kicker"><span class="journalist"></span> asks</p>
      <p class="question-text"></p>
      <form id="answer-form">
        <textarea id="answer" maxlength="200" placeholder="Your statement…" enterkeyhint="send"></textarea>
        <div class="row">
          <span id="answer-count" class="muted">0 / 200</span>
          <button class="big" type="submit">Send</button>
        </div>
        <p id="answer-error" class="error"></p>
      </form>
      <div id="answer-sent" class="sent hidden">
        <p class="kicker">Statement sent</p>
        <p id="my-answer" class="quote"></p>
        <p class="muted">Waiting for the others…</p>
        <button id="edit-answer" class="ghost" type="button">Change my answer</button>
      </div>
    </section>

    <section data-screen="vote">
      <p class="kicker">Vote for the best answer</p>
      <div id="vote-list" class="vote-list"></div>
      <p id="vote-error" class="error"></p>
    </section>

    <section data-screen="results">
      <p class="kicker" id="result-kicker">Results</p>
      <p id="result-rank" class="look-text"></p>
      <p id="result-score" class="muted"></p>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/phone.js"></script>
</body>
</html>
